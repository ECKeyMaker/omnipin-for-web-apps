name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
      - name: build
        run: pnpm build
      - name: lint
        run: pnpm check
      - name: check core bundle
        run: pnpm check:core
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
      - uses: foundry-rs/foundry-toolchain@v1
      - name: test contracts
        run: pnpm test:contracts
