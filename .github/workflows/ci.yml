name: Lint

on:
  push:
    branches: [main, feat/web-embed]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
      - name: build
        run: pnpm build
      - name: lint
        run: pnpm check
      - name: types
        run: pnpm types
      - name: check core bundle
        run: pnpm check:core
