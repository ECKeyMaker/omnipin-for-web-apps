name: Test

on:
  push:
    branches: [main, feat/web-embed]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
      - name: build
        run: pnpm build
      - name: e2e
        run: pnpm test:e2e
      - name: test
        run: pnpm test

  # Depends on third parties, so a failure here doesn't fail the build.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
      - name: live tests
        run: pnpm test
        env:
          OMNIPIN_LIVE_TESTS: 1
          OMNIPIN_LIGHTHOUSE_TOKEN: ${{ secrets.OMNIPIN_LIGHTHOUSE_TOKEN }}
          OMNIPIN_IPFS_NINJA_TOKEN: ${{ secrets.OMNIPIN_IPFS_NINJA_TOKEN }}
          OMNIPIN_AIOZ_TOKEN: ${{ secrets.OMNIPIN_AIOZ_TOKEN }}
