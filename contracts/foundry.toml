[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = false
remappings = [
  "@account-abstraction/=../node_modules/@account-abstraction/",
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "forge-std/=../node_modules/forge-std/src/",
]
allow_paths = ["../node_modules"]
